<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studenti per Classe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto w-full max-w-4xl rounded-xl bg-white p-6 shadow-lg">
        <h1 class="text-2xl font-bold text-slate-900">Elenco Studenti</h1>
        <p id="classeLabel" class="mt-2 text-sm text-slate-600"></p>
        <p id="statusMessage" class="mt-3 text-sm text-slate-600">Caricamento...</p>

        <div class="mt-4 overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">ID</th>
                        <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Nome</th>
                        <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Cognome</th>
                        <th class="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">Classe</th>
                    </tr>
                </thead>
                <tbody id="studentiBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === "localhost"
            ? "http://localhost:8080"
            : window.location.origin;

        const classeLabel = document.getElementById("classeLabel");
        const statusMessage = document.getElementById("statusMessage");
        const studentiBody = document.getElementById("studentiBody");

        function renderStudenti(studenti) {
            studentiBody.innerHTML = "";
            studenti.forEach((studente) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td class="px-4 py-2 text-sm text-slate-700">${studente.id ?? "-"}</td>
                    <td class="px-4 py-2 text-sm text-slate-700">${studente.nome ?? "-"}</td>
                    <td class="px-4 py-2 text-sm text-slate-700">${studente.cognome ?? "-"}</td>
                    <td class="px-4 py-2 text-sm text-slate-700">${studente.classe ?? "-"}</td>
                `;
                studentiBody.appendChild(row);
            });
        }

        async function loadStudentiByClasse() {
            const params = new URLSearchParams(window.location.search);
            const classe = params.get("classe");

            if (!classe) {
                classeLabel.textContent = "Nessuna classe specificata.";
                statusMessage.textContent = "Aggiungi il parametro URL ?classe=5A";
                statusMessage.className = "mt-3 text-sm text-red-600";
                return;
            }

            classeLabel.textContent = `Classe selezionata: ${classe}`;

            try {
                const response = await fetch(`${API_URL}/api/studenti?classe=${encodeURIComponent(classe)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Errore nel recupero degli studenti");
                }

                if (!Array.isArray(data) || data.length === 0) {
                    statusMessage.textContent = "Nessuno studente trovato per questa classe.";
                    statusMessage.className = "mt-3 text-sm text-slate-600";
                    return;
                }

                statusMessage.textContent = `Trovati ${data.length} studenti.`;
                statusMessage.className = "mt-3 text-sm text-green-600";
                renderStudenti(data);
            } catch (error) {
                statusMessage.textContent = error.message || "Errore durante la richiesta";
                statusMessage.className = "mt-3 text-sm text-red-600";
            }
        }

        loadStudentiByClasse();
    </script>
</body>
</html>
